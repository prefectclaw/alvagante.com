id: 816fc613-8530-4601-a525-a6ba6ff605ee
name: cheatsheet
description: >
  Generate a technical cheat sheet from AI Engineer source material.
tags:
  site: alvagante.com
  cadence: on-demand
  media: cheatsheet
inputs:
  properties:
    topic:
      type: string
      default: AI engineering media production
      description: AI engineering topic title to generate content for.
  required: []
jobs:
  - name: generate
    description: Generate the cheat sheet and write its site artifact.
    steps:
      - name: generate
        description: Run site-curation.generate_cheatsheet.
        task:
          type: model_method
          modelIdOrName: site-curation
          methodName: generate_cheatsheet
          inputs:
            mode: standalone
            topic: ${{ inputs.topic }}
            style: alfabot
            source: AI-generated engineering content
            writeFile: true
            dryRun: false
        dependsOn: []
        weight: 1
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
