id: 0198cecc-0272-4be7-b4c8-f40d4aeb3eb5
name: short-video
description: >
  Generate a short-form video script from AI Engineer source material.
tags:
  site: alvagante.com
  cadence: on-demand
  media: short-video
inputs:
  properties:
    topic:
      type: string
      default: AI engineering media production
      description: AI engineering topic title to generate content for.
  required: []
jobs:
  - name: generate
    description: Generate the short video script and write its site artifact.
    steps:
      - name: generate
        description: Run site-curation.generate_short_video.
        task:
          type: model_method
          modelIdOrName: site-curation
          methodName: generate_short_video
          inputs:
            mode: standalone
            topic: ${{ inputs.topic }}
            style: alfabot
            source: AI-generated engineering content
            writeFile: true
            dryRun: false
        dependsOn: []
        weight: 1
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
