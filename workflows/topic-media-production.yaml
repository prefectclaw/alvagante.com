id: 7d756fc1-97ae-4999-acc1-15196846f497
name: media-production
description: >
  Umbrella workflow for content generation across media types. Each media type
  is implemented as a standalone swamp workflow so it can run independently or
  as part of this full batch. Generated artifacts are written as static site
  content or generated data files.
tags:
  site: alvagante.com
  cadence: on-demand
inputs:
  properties:
    topic:
      type: string
      default: AI engineering media production
      description: AI engineering topic title to generate content for.
  required: []
jobs:
  - name: all-media
    description: Run every enabled media sub-workflow.
    steps:
      - name: generate-blog-posts
        description: Generate Alvagante AI Engineer style blog posts.
        task:
          type: workflow
          workflowIdOrName: blog-post
          inputs:
            topic: ${{ inputs.topic }}
        dependsOn: []
        weight: 1
        allowFailure: true

      - name: generate-social-posts
        description: Generate social media posts from blog content.
        task:
          type: workflow
          workflowIdOrName: social-posts
          inputs:
            topic: ${{ inputs.topic }}
        dependsOn:
          - step: generate-blog-posts
            condition:
              type: completed
        weight: 1
        allowFailure: true

      - name: generate-cheatsheets
        description: Generate technical cheat sheets from blog content.
        task:
          type: workflow
          workflowIdOrName: cheatsheet
          inputs:
            topic: ${{ inputs.topic }}
        dependsOn:
          - step: generate-blog-posts
            condition:
              type: completed
        weight: 1
        allowFailure: true

      - name: generate-infographics
        description: Generate data-driven infographic briefs from research.
        task:
          type: workflow
          workflowIdOrName: infographic
          inputs:
            topic: ${{ inputs.topic }}
        dependsOn:
          - step: generate-cheatsheets
            condition:
              type: completed
        weight: 2
        allowFailure: true

      - name: generate-short-videos
        description: Generate short-form video scripts.
        task:
          type: workflow
          workflowIdOrName: short-video
          inputs:
            topic: ${{ inputs.topic }}
        dependsOn:
          - step: generate-blog-posts
            condition:
              type: completed
        weight: 2
        allowFailure: true

      - name: generate-slides
        description: Generate slide outlines.
        task:
          type: workflow
          workflowIdOrName: slides
          inputs:
            topic: ${{ inputs.topic }}
        dependsOn:
          - step: generate-blog-posts
            condition:
              type: completed
        weight: 2
        allowFailure: true

      - name: generate-notebook
        description: Generate a working notebook note.
        task:
          type: workflow
          workflowIdOrName: notebook
          inputs:
            topic: ${{ inputs.topic }}
        dependsOn:
          - step: generate-blog-posts
            condition:
              type: completed
        weight: 2
        allowFailure: true

      - name: create-meme
        description: Create a meme brief.
        task:
          type: workflow
          workflowIdOrName: meme
          inputs:
            topic: ${{ inputs.topic }}
        dependsOn:
          - step: generate-social-posts
            condition:
              type: completed
        weight: 1
        allowFailure: true

      - name: generate-podcasts
        description: Prepare NotebookLM source notebooks for podcast episodes.
        task:
          type: workflow
          workflowIdOrName: podcast
          inputs:
            topic: ${{ inputs.topic }}
        dependsOn:
          - step: generate-blog-posts
            condition:
              type: completed
          - step: generate-social-posts
            condition:
              type: completed
          - step: generate-cheatsheets
            condition:
              type: completed
          - step: generate-infographics
            condition:
              type: completed
          - step: generate-short-videos
            condition:
              type: completed
          - step: generate-slides
            condition:
              type: completed
          - step: generate-notebook
            condition:
              type: completed
          - step: create-meme
            condition:
              type: completed
        weight: 3
        allowFailure: true
    dependsOn: []
    weight: 0
version: 1
