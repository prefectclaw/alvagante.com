id: cea4e344-e516-4c07-80ce-52bb162b86d2
name: slides
description: >
  Generate slide outline content from AI Engineer source material.
tags:
  site: alvagante.com
  cadence: on-demand
  media: slides
inputs:
  properties:
    topic:
      type: string
      default: AI engineering media production
      description: AI engineering topic title to generate content for.
  required: []
jobs:
  - name: generate
    description: Generate the slide outline and write its site artifact.
    steps:
      - name: generate
        description: Run site-curation.generate_slides.
        task:
          type: model_method
          modelIdOrName: site-curation
          methodName: generate_slides
          inputs:
            mode: standalone
            topic: ${{ inputs.topic }}
            style: alfabot
            source: AI-generated engineering content
            writeFile: true
            dryRun: false
        dependsOn: []
        weight: 1
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
