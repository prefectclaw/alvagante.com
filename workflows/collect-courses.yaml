id: 1514d0f1-a878-4c1a-ac1a-ab25fed8d32c
name: collect-courses
description: >
  Collect and populate course files for all major topic/category pairs.
  Each step is atomic — it targets exactly one topic/category file and can run
  independently. Add, remove, or reorder steps freely; each is a thin wrapper
  around course-directory.collect_courses.

  Run a single category ad-hoc with:
    swamp model method run course-directory collect_courses \
      --inputs '{"topic":"ai","category":"Machine Learning"}'
tags:
  site: alvagante.com
  cadence: on-demand
jobs:
  # ── AI ────────────────────────────────────────────────────────────────────────
  - name: ai
    description: Collect courses for the AI topic.
    steps:
      - name: ai-machine-learning
        description: ML fundamentals through advanced deep learning.
        task:
          type: model_method
          modelIdOrName: course-directory
          methodName: collect_courses
          inputs:
            topic: ai
            category: Machine Learning
            maxCourses: 20
            merge: true
        dependsOn: []
        weight: 0
        allowFailure: true

      - name: ai-llm-development
        description: Building with large language models and prompt engineering.
        task:
          type: model_method
          modelIdOrName: course-directory
          methodName: collect_courses
          inputs:
            topic: ai
