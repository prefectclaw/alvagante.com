id: 58e9f37a-e62d-4f8f-87cd-77b0143a063b
name: meme
description: >
  Create a meme brief from AI Engineer source material.
tags:
  site: alvagante.com
  cadence: on-demand
  media: meme
inputs:
  properties:
    topic:
      type: string
      default: AI engineering media production
      description: AI engineering topic title to generate content for.
  required: []
jobs:
  - name: generate
    description: Generate the meme brief and write its site artifact.
    steps:
      - name: generate
        description: Run site-curation.create_meme.
        task:
          type: model_method
          modelIdOrName: site-curation
          methodName: create_meme
          inputs:
            mode: standalone
            topic: ${{ inputs.topic }}
            style: alfabot
            source: AI-generated engineering content
            writeFile: true
            dryRun: false
        dependsOn: []
        weight: 1
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
