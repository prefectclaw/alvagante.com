id: b2c3d4e5-f6a7-8901-bcde-f12345678901
name: blog-post
description: >
  Generate a standalone AI Engineer blog post.
tags:
  site: alvagante.com
  cadence: on-demand
  media: blog-post
inputs:
  properties:
    topic:
      type: string
      default: AI engineering media production
      description: AI engineering topic title to generate content for.
  required: []
jobs:
  - name: generate
    description: Generate the blog post and write its site artifact.
    steps:
      - name: generate
        description: Run site-curation.write_blog_post.
        task:
          type: model_method
          modelIdOrName: site-curation
          methodName: write_blog_post
          inputs:
            mode: standalone
            topic: ${{ inputs.topic }}
            style: alfabot
            source: AI-generated engineering content
            writeFile: true
            dryRun: false
        dependsOn: []
        weight: 1
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
