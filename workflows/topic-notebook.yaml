id: e3920c99-a8f2-4aed-a529-4896229c54b0
name: notebook
description: >
  Generate a working notebook note from AI Engineer source material.
tags:
  site: alvagante.com
  cadence: on-demand
  media: notebook
inputs:
  properties:
    topic:
      type: string
      default: AI engineering media production
      description: AI engineering topic title to generate content for.
  required: []
jobs:
  - name: generate
    description: Generate the working notebook and write its site artifact.
    steps:
      - name: generate
        description: Run site-curation.generate_notebook.
        task:
          type: model_method
          modelIdOrName: site-curation
          methodName: generate_notebook
          inputs:
            mode: standalone
            topic: ${{ inputs.topic }}
            style: alfabot
            source: AI-generated engineering content
            writeFile: true
            dryRun: false
        dependsOn: []
        weight: 1
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
