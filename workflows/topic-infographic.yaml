id: 966be4ed-1b64-4c28-b8ec-4f53fcbfea90
name: infographic
description: >
  Generate an infographic brief from AI Engineer source material.
tags:
  site: alvagante.com
  cadence: on-demand
  media: infographic
inputs:
  properties:
    topic:
      type: string
      default: AI engineering media production
      description: AI engineering topic title to generate content for.
  required: []
jobs:
  - name: generate
    description: Generate the infographic brief and write its site artifact.
    steps:
      - name: generate
        description: Run site-curation.generate_infographic.
        task:
          type: model_method
          modelIdOrName: site-curation
          methodName: generate_infographic
          inputs:
            mode: standalone
            topic: ${{ inputs.topic }}
            style: alfabot
            source: AI-generated engineering content
            writeFile: true
            dryRun: false
        dependsOn: []
        weight: 1
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
