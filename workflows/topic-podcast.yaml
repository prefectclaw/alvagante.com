id: 91b78e0f-c0fa-4fda-a23c-6e2cedb5ee77
name: podcast
description: >
  Prepare a NotebookLM source notebook for a podcast episode.
tags:
  site: alvagante.com
  cadence: on-demand
  media: podcast
inputs:
  properties:
    topic:
      type: string
      default: AI engineering media production
      description: AI engineering topic title to generate content for.
  required: []
jobs:
  - name: generate
    description: Generate the NotebookLM podcast source notebook and write its site artifact.
    steps:
      - name: generate
        description: Run site-curation.prepare_notebooklm_podcast.
        task:
          type: model_method
          modelIdOrName: site-curation
          methodName: prepare_notebooklm_podcast
          inputs:
            mode: standalone
            topic: ${{ inputs.topic }}
            style: alfabot
            source: AI-generated engineering content and prior media artifacts
            writeFile: true
            dryRun: false
        dependsOn: []
        weight: 1
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
