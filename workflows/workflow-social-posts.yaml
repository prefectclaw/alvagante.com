id: 53df7c2e-0ed1-4994-b20f-90cf46a491a7
name: social-posts
description: >
  Generate social posts from AI Engineer source material.
tags:
  site: alvagante.com
  cadence: on-demand
  media: social-posts
inputs:
  properties:
    topic:
      type: string
      default: AI engineering media production
      description: AI engineering topic title to generate content for.
  required: []
jobs:
  - name: generate
    description: Generate the social posts and write its site artifact.
    steps:
      - name: generate
        description: Run site-curation.generate_social_posts.
        task:
          type: model_method
          modelIdOrName: site-curation
          methodName: generate_social_posts
          inputs:
            mode: standalone
            topic: ${{ inputs.topic }}
            style: alfabot
            source: AI-generated engineering content
            writeFile: true
            dryRun: false
        dependsOn: []
        weight: 1
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
