title: Alvagante
description: Useful links and daily AI-assisted news digests.
url: "https://alvagante.com"
baseurl: ""
logo: /assets/img/alvagante-logo.png
header_logo: /assets/img/alvagante-logo-horizontal.png
favicon: /assets/img/alvagante-favicon.png
timezone: Europe/Rome
company:
  name: Lab42 Srl
  vat_id: IT03677180121
  email: info@lab42.it
markdown: kramdown
permalink: pretty

exclude:
  - AGENTS.md
  - .bundle/
  - .dockerignore
  - .github/
  - .jekyll-cache/
  - .jekyll-metadata
  - .sass-cache/
  - .swamp/
  - .swamp-sources.yaml
  - .agents/
  - .claude/
  - docker-compose.yml
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - extensions/
  - manifest.yaml
  - models/
  - README.md
  - vendor/
  - vaults/
  - workflows/

defaults:
  - scope:
      path: ""
    values:
      layout: default

# Collections for AI engineering section
collections:
  ai-blog:
    output: true
    permalink: /ai-engineer/blog/:path/
  ai-notebooks:
    output: true
    permalink: /ai-engineer/notebooks/:path/
  ai-slides:
    output: true
    permalink: /ai-engineer/slides/:path/
  ai-cheat-sheets:
    output: true
    permalink: /ai-engineer/cheat-sheets/:path/
  ai-infographics:
    output: true
    permalink: /ai-engineer/infographics/:path/
  ai-social-posts:
    output: true
    permalink: /ai-engineer/social/:path/
  ai-podcasts:
    output: true
    permalink: /ai-engineer/podcasts/:path/
  ai-videos:
    output: true
    permalink: /ai-engineer/videos/:path/
  ai-memes:
    output: true
    permalink: /ai-engineer/memes/:path/
